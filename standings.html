<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standings · 2026 DK NFL League - II</title>


  <style>
    :root {
      --bg:          #030d06;
      --surface:     #071a0d;
      --surface2:    #0c2414;
      --border:      #143d1c;
      --border2:     #1c5228;
      --accent:      #ffffff;
      --accent2:     #d0d8d4;
      --green:       #2ecc71;
      --red:         #e74c3c;
      --muted:       #5e7068;
      --text:        #ffffff;
      --text-dim:    #9ab0a4;
      --heading:     #ffffff;
      --radius:      4px;
      --font-ui:     'Calibri', 'Candara', sans-serif;
      --font-mono:   'Calibri', 'Candara', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      gap: 16px;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .04em;
      color: var(--heading);
      white-space: nowrap;
    }
    .logo span { color: var(--accent); }
    nav { display: flex; gap: 4px; flex-wrap: nowrap; }
    @media (max-width: 480px) {
      .logo { font-size: 15px; }
      nav a { font-size: 12px; padding: 6px 7px; }
    }
    nav a {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 6px 10px;
      border-radius: var(--radius);
      transition: color .15s, background .15s;
    }
    nav a:hover, nav a:focus {
      color: var(--accent);
      background: rgba(255,255,255,.10);
      text-decoration: none;
    }
    nav a.active {
      color: var(--accent);
      background: rgba(255,255,255,.15);
    }

    .hero {
      background: linear-gradient(135deg, #020a04 0%, #061510 55%, #0a2210 100%);
      border-bottom: 1px solid var(--border);
      padding: 40px 16px 32px;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: .03em;
      color: var(--heading);
      line-height: 1.1;
    }
    .hero h1 span { color: var(--accent); }

    .section { padding: 40px 16px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      margin-bottom: 24px;
    }
    h2.block-heading {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 900;
      color: var(--heading);
      letter-spacing: .02em;
      margin-bottom: 20px;
    }

    .standings-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .standings-controls select {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border2);
      padding: 7px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      outline: none;
    }
    .standings-controls select:focus { border-color: var(--accent); }
    .btn-refresh {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-refresh:hover { background: var(--accent); color: #000; }
    #refresh-status {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .standings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }
    .standings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .standings-card-header {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 9px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .standings-table th {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 7px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
    }
    .standings-table th:not(:first-child) { text-align: center; }
    .standings-table td {
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .standings-table tr:last-child td { border-bottom: none; }
    .standings-table td:not(:first-child) {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .standings-table tr:hover td { background: rgba(255,255,255,.025); }
    .rank-num {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-right: 6px;
    }
    .win-pct { color: var(--accent); }

    /* Conference separator banner */
    .conf-banner {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }
    .conf-banner:first-child { margin-top: 0; }
    .conf-banner-label {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--heading);
      white-space: nowrap;
    }
    .conf-banner-label span { color: var(--accent); }
    .conf-banner-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, var(--accent), transparent);
      border-radius: 2px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-left: 3px solid var(--green);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px 18px;
      border-radius: var(--radius);
      z-index: 300;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 16px;
      text-align: center;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: underline; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }

    /* View tabs */
    .view-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }
    .view-tab {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .view-tab:hover { border-color: var(--accent); color: var(--accent); }
    .view-tab.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    @media (max-width: 600px) {
      #standings-grid { max-width: 100% !important; }
    }

    /* Conference colors */

    .conf-nfc { color: #1a5276 !important; }

    .conf-banner-label.conf-nfc span { color: #1a5276; }
    .standings-card-header.conf-afc { color: #c0392b; }
    .standings-card-header.conf-nfc { color: #1a5276; }
  
    /* ── Points leaderboard ── */
    #points-view { display: none; }
    .points-table-wrap {
      max-width: 660px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .points-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .points-table th {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .points-table td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .points-table tr:last-child td { border-bottom: none; }
    .points-table td:not(:first-child):not(:nth-child(2)) {
      text-align: right;
      font-family: var(--font-mono);
    }
    .points-table th:not(:first-child):not(:nth-child(2)) { text-align: right; }
    .points-table tr:hover td { background: rgba(255,255,255,.025); }
    .pts-rank { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 6px; }
    .pts-user { color: #e8a020; font-weight: 700; }
    .pts-abbr { color: var(--text-dim); font-size: 11px; margin-left: 4px; }
    .pts-total { color: var(--accent); font-size: 14px; font-weight: 700; }
    .pts-empty { padding: 32px 14px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── Claim button & Available badge — gold ── */
    .btn-claim { background: #e8a020 !important; color: #000 !important; }
    .btn-claim:hover { background: #c47010 !important; }
    .btn-claim:disabled { background: #5a5a5a !important; color: #aaa !important; }
    .badge-available { background: rgba(46,204,113,.12) !important; color: #2ecc71 !important; border-color: rgba(46,204,113,.25) !important; }

    .conf-grid .conf-card:first-child .conf-header { color: #f05050; border-bottom-color: #f05050; }
    .conf-grid .conf-card:first-child .conf-header small { color: rgba(240,80,80,.65); }

    .conf-grid .conf-card:last-child .conf-header small { color: rgba(96,165,250,.65); }
    .conf-grid .conf-card:last-child .division-name { color: #4a90d8; }

  const TEAM_ABBR = {
    'Baltimore Ravens':      'BAL',

  // ── Runtime state ──────────────────────────────────────────────
  let leagueData       = null;
  let claimedTeams     = {};
  let allMatchups      = [];
  window._claimUsernames = {};

  function allTeamsClaimed() {
    return leagueData && Object.keys(claimedTeams).length >= leagueData.teams.length;
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // ── Data loading ───────────────────────────────────────────────
  async function loadClaims() {
    if (!isLive()) {
      try { claimedTeams = JSON.parse(localStorage.getItem('gfl2_claimed') || '{}');
            window._claimUsernames = JSON.parse(localStorage.getItem('gfl2_usernames') || '{}'); } catch(e){}
      return;
    }
    try {
      const d = await fetch(GOOGLE_SHEETS_CONFIG.APPS_SCRIPT_URL + '?action=claims').then(r=>r.json());
      if (d.success) { claimedTeams = d.claims||{}; window._claimUsernames = d.usernames||{}; }
    } catch(e) { console.warn('loadClaims',e); }
  }
  async function loadMatchupsData() {
    if (!isLive()) return [];
    try {
      const d = await fetch(GOOGLE_SHEETS_CONFIG.APPS_SCRIPT_URL + '?action=matchups').then(r=>r.json());
      return d.success && d.matchups ? d.matchups : [];
    } catch(e) { return []; }
  }
  async function loadStandings() {
    if (!isLive()) return MOCK_LEAGUE.standings;
    try {
      const d = await fetch(GOOGLE_SHEETS_CONFIG.APPS_SCRIPT_URL + '?action=standings').then(r=>r.json());
      if (d.success && d.standings && d.standings.length) return d.standings;
    } catch(e) { console.warn('loadStandings',e); }
    return MOCK_LEAGUE.standings;
  }

  // ═══════════════════════════════════════════════════════════════
  //  NFL TIEBREAKER ENGINE
  //  Division tiebreakers (in order):
  //    1. Head-to-head (teams play each other twice)
  //    2. Division record
  //    3. Common opponents record
  //    4. Conference record
  //    5. Points scored (DFS pts)
  //    6. Net points (PF minus PA)
  //
  //  Wild-card / cross-division:
  //    1. Head-to-head (if applicable)
  //    2. Conference record
  //    3. Points scored
  //    4. Net points
  //
  //  Division winners always hold seeds 1-4.
  //  Wild cards always hold seeds 5-7.
  // ═══════════════════════════════════════════════════════════════

  function _pct(w, l) { const g=(w|0)+(l|0); return g?((w|0)/g):0; }

  function _nameById() {
    const m = {};
    MOCK_LEAGUE.teams.forEach(t => m[t.id] = t.name);
    return m;
  }

  function _h2h(idA, idB, matchups, nbm) {
    const nA = nbm[idA], nB = nbm[idB];
    let aW = 0, bW = 0;
    for (const m of matchups) {
      if (m.homeScore == null || m.awayScore == null) continue;
      const ab = (m.homeTeam===nA && m.awayTeam===nB);
      const ba = (m.homeTeam===nB && m.awayTeam===nA);
      if (!ab && !ba) continue;
      const hw = m.homeScore >= m.awayScore;
      if ((ab && hw)||(ba && !hw)) aW++; else bW++;
    }
    return {aW,bW};
  }

  function _commonOppPct(idA, idB, matchups, nbm) {
    const nA = nbm[idA], nB = nbm[idB];
    const oppsA = new Set(), oppsB = new Set();
    for (const m of matchups) {
      if (m.homeScore == null || m.awayScore == null) continue;
      if (m.homeTeam===nA) oppsA.add(m.awayTeam);
      if (m.awayTeam===nA) oppsA.add(m.homeTeam);
      if (m.homeTeam===nB) oppsB.add(m.awayTeam);
      if (m.awayTeam===nB) oppsB.add(m.homeTeam);
    }
    const common = [...oppsA].filter(o => oppsB.has(o));
    if (!common.length) return {pctA:0, pctB:0, hasCommon:false};
    let aW=0,aL=0,bW=0,bL=0;
    for (const m of matchups) {
      if (m.homeScore == null || m.awayScore == null) continue;
      const hw = m.homeScore >= m.awayScore;
      if (m.homeTeam===nA && common.includes(m.awayTeam)) { hw?aW++:aL++; }
      if (m.awayTeam===nA && common.includes(m.homeTeam)) { !hw?aW++:aL++; }
      if (m.homeTeam===nB && common.includes(m.awayTeam)) { hw?bW++:bL++; }
      if (m.awayTeam===nB && common.includes(m.homeTeam)) { !hw?bW++:bL++; }
    }
    return {pctA:_pct(aW,aL), pctB:_pct(bW,bL), hasCommon:true};
  }

  function _cmp(a, b, sMap, matchups, nbm, sameDivision) {
    const sa = sMap[a.id]||{}, sb = sMap[b.id]||{};
    // 1. Overall record: more wins first, then fewer losses
    if ((sa.wins|0) !== (sb.wins|0)) return (sb.wins|0) - (sa.wins|0);
    if ((sa.losses|0) !== (sb.losses|0)) return (sa.losses|0) - (sb.losses|0);
    // 2. H2H
    const {aW,bW} = _h2h(a.id, b.id, matchups, nbm);
    if (aW!==bW) return aW>bW?-1:1;
    if (sameDivision) {
      // 3. Division record: more div wins first, then fewer div losses
      if ((sa.divWins|0) !== (sb.divWins|0)) return (sb.divWins|0) - (sa.divWins|0);
      if ((sa.divLosses|0) !== (sb.divLosses|0)) return (sa.divLosses|0) - (sb.divLosses|0);
      // 4. Common opponents
      const {pctA,pctB,hasCommon} = _commonOppPct(a.id, b.id, matchups, nbm);
      if (hasCommon && Math.abs(pctA-pctB) > 1e-9) return pctB>pctA?1:-1;
    }
    // 5. Conference record: more conf wins first, then fewer conf losses
    if ((sa.confWins|0) !== (sb.confWins|0)) return (sb.confWins|0) - (sa.confWins|0);
    if ((sa.confLosses|0) !== (sb.confLosses|0)) return (sa.confLosses|0) - (sb.confLosses|0);
    // 6. Points scored
    const d6 = (sb.pointsFor||0) - (sa.pointsFor||0);
    if (Math.abs(d6) > 0.001) return d6>0?1:-1;
    // 7. Net points
    const netA = (sa.pointsFor||0)-(sa.pointsAgainst||0);
    const netB = (sb.pointsFor||0)-(sb.pointsAgainst||0);
    return netB>netA?1:(netA>netB?-1:0);
  }

  function _sortDiv(teams, sMap, matchups, nbm) {
    return [...teams].sort((a,b)=>_cmp(a,b,sMap,matchups,nbm,true));
  }
  function _sortCross(teams, sMap, matchups, nbm) {
    return [...teams].sort((a,b)=>_cmp(a,b,sMap,matchups,nbm,false));
  }

  function _playoffSeeds(confId, sMap, matchups, nbm) {
    const divs = MOCK_LEAGUE.divisions.filter(d=>d.confId===confId);
    const winners=[]; const nonWinners=[];
    for (const div of divs) {
      const sorted = _sortDiv(MOCK_LEAGUE.teams.filter(t=>t.divId===div.id), sMap, matchups, nbm);
      winners.push({team:sorted[0], divName:div.name});
      for (let i=1;i<sorted.length;i++) nonWinners.push(sorted[i]);
    }
    const sortedW  = [...winners].sort((a,b)=>_cmp(a.team,b.team,sMap,matchups,nbm,false));
    const sortedWC = _sortCross(nonWinners, sMap, matchups, nbm);
    return {
      seeds: [
        ...sortedW.map((dw,i)=>({...dw.team,seed:i+1,type:'div',divName:dw.divName})),
        ...sortedWC.slice(0,3).map((t,i)=>({...t,seed:i+5,type:'wc'})),
      ],
      out: sortedWC.slice(3),
    };
  }

  // ── Current view ───────────────────────────────────────────────
  let currentView = 'division';

  function switchView(view, btn) {
    currentView = view;
    document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderStandings(leagueData.standings);
  }

  function confClass(confId) { return confId==='afc'?'conf-afc':'conf-nfc'; }

  function buildCard(headerText, sortedTeams, standings, confId) {
    const sMap = {}; standings.forEach(s => sMap[s.teamId]=s);
    const rows = sortedTeams.map((team,i) => {
      const s = sMap[team.id]||{};
      const played = (s.wins|0)+(s.losses|0);
      const p = played ? ((s.wins|0)/played).toFixed(3).replace(/^0/,'') : '.000';
      const abbr = TEAM_ABBR[team.name]||team.name;
      const dk   = window._claimUsernames && window._claimUsernames[team.id];
      const disp = dk ? `${abbr}<br><span style="color:#e8a020;font-size:10px">${escHtml(dk)}</span>` : abbr;
      return `<tr>
        <td><span class="rank-num">${i+1}</span>${disp}</td>
        <td>${s.wins|0}-${s.losses|0}</td><td class="win-pct">${p}</td>
        <td>${s.divWins|0}-${s.divLosses|0}</td><td>${s.confWins|0}-${s.confLosses|0}</td>
      </tr>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'standings-card';
    card.innerHTML = `
      <div class="standings-card-header ${confId?confClass(confId):''}">${headerText}</div>
      <table class="standings-table">
        <thead><tr><th>Team</th><th>W-L</th><th>PCT</th><th>DIV</th><th>CONF</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    return card;
  }

  function renderStandings(standings) {
    const grid = document.getElementById('standings-grid');
    grid.innerHTML = ''; grid.style.maxWidth = ''; grid.style.margin = '';
    const sMap = {}; standings.forEach(s => sMap[s.teamId]=s);
    const nbm  = _nameById();

    if (currentView === 'league') {
      grid.style.gridTemplateColumns = '1fr';
      grid.style.maxWidth = '75%'; grid.style.margin = '0 auto';
      grid.appendChild(buildCard('Overall League Standings',
        _sortCross(leagueData.teams, sMap, allMatchups, nbm), standings, null));

    } else if (currentView === 'conference') {
      grid.style.gridTemplateColumns = '1fr';
      grid.style.maxWidth = '75%'; grid.style.margin = '0 auto';
      for (const conf of leagueData.conferences) {
        const confTeams = leagueData.teams.filter(t => leagueData.divisions.find(d=>d.id===t.divId)?.confId===conf.id);
        const banner = document.createElement('div');
        banner.className = 'conf-banner';
        banner.innerHTML = `<div class="conf-banner-label ${confClass(conf.id)}">${conf.name}</div><div class="conf-banner-line"></div>`;
        grid.appendChild(banner);
        grid.appendChild(buildCard(conf.name, _sortCross(confTeams,sMap,allMatchups,nbm), standings, conf.id));
      }

    } else if (currentView === 'division') {
      grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(380px, 1fr))';
      let lastConf = null;
      for (const div of leagueData.divisions) {
        const conf = leagueData.conferences.find(c=>c.id===div.confId);
        if (conf.id !== lastConf) {
          lastConf = conf.id;
          const banner = document.createElement('div');
          banner.className = 'conf-banner';
          banner.innerHTML = `<div class="conf-banner-label ${confClass(conf.id)}">${conf.name}</div><div class="conf-banner-line"></div>`;
          grid.appendChild(banner);
        }
        const divTeams = leagueData.teams.filter(t=>t.divId===div.id);
        grid.appendChild(buildCard(`${conf.name} ${div.name}`,
          _sortDiv(divTeams, sMap, allMatchups, nbm), standings, conf.id));
      }

    }
  }

  async function boot() {
    leagueData = MOCK_LEAGUE;
    await loadClaims();
    const [standings, matchups] = await Promise.all([
      loadStandings(), loadMatchupsData()
    ]);
    leagueData.standings = standings;
    allMatchups = matchups;

    currentView = 'division';
    document.querySelectorAll('.view-tab').forEach(b => {
      b.classList.toggle('active', b.textContent.trim() === 'Division');
    });
    renderStandings(leagueData.standings);
  }

  boot();
</script>
</body>
</html>
